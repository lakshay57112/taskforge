[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "An automated factory that turns a real repository into validated Harbor feature-development tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
harbor = ["harbor==0.25.*"]
dev = ["pytest>=8"]

[project.scripts]
taskforge = "taskforge.cli:main"

[tool.setuptools.packages.find]
include = ["taskforge*"]

[tool.setuptools.package-data]
taskforge = ["prompts/*.md", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
