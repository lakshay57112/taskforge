name: Run the factory

# Full pipeline on a Linux runner with Docker, including Harbor validation.
# Start it from the Actions tab (Run workflow), or by pushing to the `factory-run` branch with a
# `factory-run.env` file (TASKS=, PROVIDER=, MODEL=).
# Add the key for your provider as a repository secret (Settings > Secrets and variables > Actions):
#   gemini -> GEMINI_API_KEY, openrouter -> OPENROUTER_API_KEY, groq -> GROQ_API_KEY
# Results are saved to the `factory-output/<run id>` branch and attached to the run as an artifact.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Number of tasks to build"
        default: "5"
      provider:
        description: "gemini, openrouter or groq"
        default: "gemini"
      model:
        description: "Model name (leave empty for the provider's default)"
        default: ""
  push:
    branches: [factory-run]

permissions:
  contents: write

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TASKS: ${{ inputs.tasks || '3' }}
      PROVIDER: ${{ inputs.provider || 'gemini' }}
      MODEL: ${{ inputs.model }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Read run settings (push trigger)
        if: github.event_name == 'push' && hashFiles('factory-run.env') != ''
        run: grep -E '^(TASKS|PROVIDER|MODEL)=' factory-run.env >> "$GITHUB_ENV"

      - name: Check the API key secret
        run: |
          case "$PROVIDER" in
            gemini) KEY_NAME=GEMINI_API_KEY ;;
            openrouter) KEY_NAME=OPENROUTER_API_KEY ;;
            groq) KEY_NAME=GROQ_API_KEY ;;
            *) echo "::error::Unknown provider '$PROVIDER' (use gemini, openrouter or groq)"; exit 1 ;;
          esac
          if [ -z "${!KEY_NAME}" ]; then
            echo "::error::No $KEY_NAME secret. Add it under Settings > Secrets and variables > Actions > Secrets > New repository secret."
            exit 1
          fi
          echo "provider=$PROVIDER tasks=$TASKS model=${MODEL:-default}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[harbor,dev]"

      - name: Check which models answer
        run: |
          ARGS=(--provider "$PROVIDER")
          if [ -n "$MODEL" ]; then ARGS+=("$MODEL"); fi
          taskforge ping "${ARGS[@]}" || true

      - name: Run TaskForge
        run: |
          # snapshot progress to the factory-output branch every 5 minutes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d); git worktree add -q --detach "$SNAP" HEAD
          ( while sleep 300; do
              mkdir -p "$SNAP/output"; rsync -a --delete --exclude harbor-jobs output/ "$SNAP/output/" 2>/dev/null
              cp factory.log "$SNAP/" 2>/dev/null
              ( cd "$SNAP" && git add -f factory.log output && git commit -q -m "Factory run ${{ github.run_id }}: in progress" && git push -q -f origin HEAD:refs/heads/factory-output/${{ github.run_id }} ) >/dev/null 2>&1
            done ) &
          ARGS=(--tasks "$TASKS" --provider "$PROVIDER")
          if [ -n "$MODEL" ]; then ARGS+=(--model "$MODEL"); fi
          taskforge run "${ARGS[@]}" 2>&1 | tee factory.log
          exit "${PIPESTATUS[0]}"

      - name: Save results to a factory-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "factory-output/${{ github.run_id }}"
          for p in factory.log .taskforge_cache output; do [ -e "$p" ] && git add -f "$p"; done
          git reset -q -- 'output/*/harbor-jobs' 2>/dev/null || true
          git commit -q -m "Factory run ${{ github.run_id }} ($PROVIDER, $TASKS tasks)" || exit 0
          git push -f origin "factory-output/${{ github.run_id }}"

      - name: Upload task packages, report and model cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskforge-output
          path: |
            output
            .taskforge_cache
            factory.log
          if-no-files-found: ignore
